server:
  port: ${CURRICULUM_PORT:8082}

spring:
  application:
    name: curriculum-service
  datasource:
    url: ${CURRICULUM_DB_URL:jdbc:postgresql://localhost:5432/curriculum_db}
    username: ${CURRICULUM_DB_USERNAME:mathzero_admin}
    password: ${CURRICULUM_DB_PASSWORD:change-me-locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:change-this-local-development-secret-at-least-32-bytes}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
