server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    # A standalone registry neither registers with itself nor fetches a registry.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Keep the production-safe default; local single-node setups may set this to false.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Mathematics Zero to Hero service registry
