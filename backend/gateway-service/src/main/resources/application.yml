server:
  port: ${GATEWAY_PORT:8090}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Downstream routes are added as each business service is implemented.
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

app:
  version: ${APP_VERSION:0.1.0}
  cors:
    # Comma-separated list of browser origins allowed to call the public API.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Mathematics Zero to Hero API Gateway
    version: ${app.version}
