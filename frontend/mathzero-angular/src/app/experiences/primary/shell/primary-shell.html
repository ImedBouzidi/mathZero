<div class="flex min-h-dvh flex-col bg-canvas text-ink">
  <a class="skip-link" href="#main-content">{{ i18n.translate('nav.skip') }}</a>

  <header class="sticky top-0 z-40 border-b border-line bg-surface/95 backdrop-blur-sm">
    <div class="mx-auto flex w-full max-w-[var(--content-max)] items-center gap-3 px-4 py-3 sm:px-6">
      <a
        routerLink="/primary"
        class="focus-ring flex min-w-0 items-center gap-3 rounded-control"
        [attr.aria-label]="i18n.translate('experience.theme.primary')"
      >
        <span class="primary-mark" aria-hidden="true">∑</span>
        <span class="flex min-w-0 flex-col leading-tight">
          <span class="truncate text-base font-semibold tracking-tight text-ink">
            {{ i18n.translate('experience.theme.primary') }}
          </span>
          <span class="hidden truncate text-xs font-medium text-muted sm:block">
            {{ i18n.translate('landing.primary.tagline') }}
          </span>
        </span>
      </a>

      <div class="ms-auto flex items-center gap-1.5 sm:gap-2">
        <span class="primary-chip" [attr.aria-label]="i18n.translate('primary.stars.aria')">
          <app-icon name="star" [size]="16" />
          <span class="tabular-nums">0</span>
        </span>
        <span class="primary-chip" [attr.aria-label]="i18n.translate('primary.streak.aria')">
          <app-icon name="flame" [size]="16" />
          <span class="tabular-nums">0</span>
        </span>
        <app-language-switch />
        <a
          routerLink="/profile"
          class="focus-ring grid size-10 place-items-center rounded-full bg-subtle text-muted transition-colors hover:text-ink"
          [attr.aria-label]="i18n.translate('primary.nav.me')"
        >
          <app-icon name="user" [size]="19" />
        </a>
      </div>
    </div>

    <nav
      class="mx-auto hidden w-full max-w-[var(--content-max)] items-center gap-1 px-4 pb-2 sm:px-6 lg:flex"
      [attr.aria-label]="i18n.translate('primary.nav.label')"
    >
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-accent-soft text-accent"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
          class="focus-ring flex items-center gap-2 rounded-pill px-4 py-2 text-sm font-semibold text-muted transition-colors hover:bg-subtle hover:text-ink"
        >
          <app-icon [name]="item.icon" [size]="18" />
          {{ i18n.translate(item.labelKey) }}
        </a>
      }
    </nav>
  </header>

  <main id="main-content" tabindex="-1" class="flex-1 pb-24 lg:pb-0">
    <router-outlet />
  </main>

  <nav
    class="fixed inset-x-0 bottom-0 z-40 border-t border-line bg-surface px-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-1.5 lg:hidden"
    [attr.aria-label]="i18n.translate('primary.nav.label')"
  >
    <div class="mx-auto flex max-w-lg items-stretch justify-between gap-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-accent"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
          class="focus-ring flex min-h-14 flex-1 flex-col items-center justify-center gap-1 rounded-control px-1 py-1 text-[0.6875rem] font-semibold text-muted transition-colors hover:text-ink"
        >
          <app-icon [name]="item.icon" [size]="22" [strokeWidth]="2" />
          <span class="truncate">{{ i18n.translate(item.labelKey) }}</span>
        </a>
      }
    </div>
  </nav>
</div>
